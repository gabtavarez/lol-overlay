name: Sonda OP.GG
# Manual: salva respostas cruas do OP.GG MCP na branch probe-report (para planejar novos recursos).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-sites.js
      - run: |
          git config user.name "audit-bot"
          git config user.email "audit-bot@users.noreply.github.com"
          git checkout --orphan probe-report
          git rm -rf --cached . >/dev/null
          git add -f audit/probe
          git commit -m "Sonda OP.GG"
          git push -f origin probe-report
