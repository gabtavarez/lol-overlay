<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; font-src 'self'; img-src https://ddragon.leagueoflegends.com https://raw.communitydragon.org data:; style-src 'self'; script-src 'self'">
  <title>Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <section id="buys" class="box" data-panel="buys" hidden>
    <header class="drag"><span>COMPRAS · IA</span><small id="gold"></small></header>
    <div id="recall" class="recall" hidden></div>
    <div id="list"></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="info" class="box" data-panel="info" hidden>
    <header class="drag"><span>ROTA</span><small id="info-vs"></small></header>
    <div id="phases" class="phases" hidden></div>
    <div id="scout" hidden></div>
    <div id="matchup" class="note" hidden></div>
    <div id="alerts" hidden></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="goldbox" class="box gold-box" data-panel="gold" hidden>
    <header class="drag"><span>OURO · CARA A CARA</span><small id="team-diff"></small></header>
    <div id="gold-rows"></div>
    <div class="gold-foot">Valor dos itens de cada um</div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="timersbox" class="box timers-box" data-panel="timers" hidden>
    <header class="drag"><span>TIMERS</span><small>clique no feitiço para marcar</small></header>
    <div id="obj"></div>
    <div id="spells"></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="kitbox" class="box kit-box" data-panel="kit" hidden>
    <header class="drag"><span>HABILIDADES DO OPONENTE</span><small id="kit-src"></small></header>
    <div id="kit"></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="goalsbox" class="box goals-box" data-panel="goals" hidden>
    <header class="drag"><span>METAS DA PARTIDA</span><small id="goals-aim"></small></header>
    <div id="goals"></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <section id="coachbox" class="box coach-box" data-panel="coach" hidden>
    <header class="drag"><span>COACH DE ROTA</span><small id="coach-vs"></small></header>
    <div class="c-top"><span id="coach-pill" class="c-pill"></span></div>
    <p id="coach-head" class="c-head"></p>
    <div id="coach-rows"></div>
    <div class="grip" title="Arraste para redimensionar"></div>
  </section>

  <div id="edit-bar" hidden>
    <span>Modo de edição: arraste o título para mover e o canto para redimensionar.</span>
    <button id="move-done" type="button">Concluir</button>
  </div>
  <script src="common.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
